<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="Language distribution across public repositories">
  <style>
    .muted { fill: #6b7280; }
    .rule  { stroke: #d8dee4; stroke-width: 1; }
    .track { fill: #eaeef2; }
    @media (prefers-color-scheme: dark) {
      .muted { fill: #8b949e; }
      .rule  { stroke: #30363d; }
      .track { fill: #21262d; }
    }
    .kicker { font: 500 11px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; letter-spacing: 0.22em; }
    .leg    { font: 400 10px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; letter-spacing: 0.08em; }
  </style>

  <line class="rule" x1="0" y1="1" x2="900" y2="1"/>

  <text class="kicker muted" x="0" y="28">LANGUAGE DISTRIBUTION</text>
  <text class="kicker muted" x="900" y="28" text-anchor="end">PUBLIC REPOS</text>

  <rect class="track" x="0" y="48" width="900" height="6" rx="3"/>

  <g>
    <rect x="0"     y="48" width="0" height="6" fill="#f1e05a"><animate attributeName="width" from="0" to="264.6" dur="0.9s" begin="0.00s" fill="freeze"/></rect>
    <rect x="264.6" y="48" width="0" height="6" fill="#3572A5"><animate attributeName="width" from="0" to="215.1" dur="0.9s" begin="0.10s" fill="freeze"/></rect>
    <rect x="479.7" y="48" width="0" height="6" fill="#e34c26"><animate attributeName="width" from="0" to="132.3" dur="0.9s" begin="0.20s" fill="freeze"/></rect>
    <rect x="612.0" y="48" width="0" height="6" fill="#355570"><animate attributeName="width" from="0" to="99.9"  dur="0.9s" begin="0.30s" fill="freeze"/></rect>
    <rect x="711.9" y="48" width="0" height="6" fill="#663399"><animate attributeName="width" from="0" to="78.3"  dur="0.9s" begin="0.40s" fill="freeze"/></rect>
    <rect x="790.2" y="48" width="0" height="6" fill="#3178c6"><animate attributeName="width" from="0" to="61.2"  dur="0.9s" begin="0.50s" fill="freeze"/></rect>
    <rect x="851.4" y="48" width="0" height="6" fill="#8b949e"><animate attributeName="width" from="0" to="48.6"  dur="0.9s" begin="0.60s" fill="freeze"/></rect>
  </g>

  <g>
    <rect x="0"   y="80" width="6" height="6" fill="#f1e05a"/><text class="leg muted" x="12"  y="86">JAVASCRIPT 29.4</text>
    <rect x="129" y="80" width="6" height="6" fill="#3572A5"/><text class="leg muted" x="141" y="86">PYTHON 23.9</text>
    <rect x="258" y="80" width="6" height="6" fill="#e34c26"/><text class="leg muted" x="270" y="86">HTML 14.7</text>
    <rect x="387" y="80" width="6" height="6" fill="#355570"/><text class="leg muted" x="399" y="86">GDSCRIPT 11.1</text>
    <rect x="516" y="80" width="6" height="6" fill="#663399"/><text class="leg muted" x="528" y="86">CSS 8.7</text>
    <rect x="645" y="80" width="6" height="6" fill="#3178c6"/><text class="leg muted" x="657" y="86">TYPESCRIPT 6.8</text>
    <rect x="774" y="80" width="6" height="6" fill="#8b949e"/><text class="leg muted" x="786" y="86">OTHER 5.4</text>
  </g>

  <line class="rule" x1="0" y1="112" x2="900" y2="112"/>
</svg>
