<svg xmlns="http://www.w3.org/2000/svg" width="400" height="268" viewBox="0 0 400 268" role="img" aria-label="Top languages">
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #0b3d91; font: 600 15px 'Segoe UI', Ubuntu, Sans-Serif; }
    .lbl { fill: #24292f; font: 500 12px 'Segoe UI', Ubuntu, Sans-Serif; }
    .pct { fill: #57606a; font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; }
    .track { fill: #eaeef2; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .title { fill: #2f81f7; }
      .lbl { fill: #c9d1d9; }
      .pct { fill: #8b949e; }
      .track { fill: #21262d; }
    }
  </style>

  <rect class="card" x="0.5" y="0.5" width="399" height="267" rx="8"/>
  <text class="title" x="22" y="34">Top Languages</text>

  <g transform="translate(22,54)">
    <g transform="translate(0,0)">
      <text class="lbl" x="0" y="11">JavaScript</text>
      <text class="pct" x="356" y="11" text-anchor="end">29.4%</text>
      <rect class="track" x="0" y="18" width="356" height="9" rx="4.5"/>
      <rect x="0" y="18" width="0" height="9" rx="4.5" fill="#f1e05a">
        <animate attributeName="width" from="0" to="356" dur="1.1s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </g>
    <g transform="translate(0,36)">
      <text class="lbl" x="0" y="11">Python</text>
      <text class="pct" x="356" y="11" text-anchor="end">23.9%</text>
      <rect class="track" x="0" y="18" width="356" height="9" rx="4.5"/>
      <rect x="0" y="18" width="0" height="9" rx="4.5" fill="#3572A5">
        <animate attributeName="width" from="0" to="289" dur="1.1s" begin="0.12s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </g>
    <g transform="translate(0,72)">
      <text class="lbl" x="0" y="11">HTML</text>
      <text class="pct" x="356" y="11" text-anchor="end">14.7%</text>
      <rect class="track" x="0" y="18" width="356" height="9" rx="4.5"/>
      <rect x="0" y="18" width="0" height="9" rx="4.5" fill="#e34c26">
        <animate attributeName="width" from="0" to="178" dur="1.1s" begin="0.24s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </g>
    <g transform="translate(0,108)">
      <text class="lbl" x="0" y="11">GDScript</text>
      <text class="pct" x="356" y="11" text-anchor="end">11.1%</text>
      <rect class="track" x="0" y="18" width="356" height="9" rx="4.5"/>
      <rect x="0" y="18" width="0" height="9" rx="4.5" fill="#355570">
        <animate attributeName="width" from="0" to="134" dur="1.1s" begin="0.36s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </g>
    <g transform="translate(0,144)">
      <text class="lbl" x="0" y="11">CSS</text>
      <text class="pct" x="356" y="11" text-anchor="end">8.7%</text>
      <rect class="track" x="0" y="18" width="356" height="9" rx="4.5"/>
      <rect x="0" y="18" width="0" height="9" rx="4.5" fill="#663399">
        <animate attributeName="width" from="0" to="105" dur="1.1s" begin="0.48s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </g>
    <g transform="translate(0,180)">
      <text class="lbl" x="0" y="11">TypeScript</text>
      <text class="pct" x="356" y="11" text-anchor="end">6.8%</text>
      <rect class="track" x="0" y="18" width="356" height="9" rx="4.5"/>
      <rect x="0" y="18" width="0" height="9" rx="4.5" fill="#3178c6">
        <animate attributeName="width" from="0" to="82" dur="1.1s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </g>
  </g>
</svg>
